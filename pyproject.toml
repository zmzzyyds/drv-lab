[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drv-lab"
version = "0.1.0"
description = "One-command QEMU lab: build, load and actually run an out-of-tree Linux driver"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-only"
authors = [
    { name = "drv-lab contributors" },
]
keywords = [
    "linux",
    "kernel",
    "driver",
    "qemu",
    "testing",
    "embedded",
    "arm64",
    "kbuild",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
    "Topic :: System :: Operating System Kernels :: Linux",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
drvlab = "drvlab.cli:main"

[project.urls]
Homepage = "https://github.com/zmzzyyds/drv-lab"
Repository = "https://github.com/zmzzyyds/drv-lab"
Issues = "https://github.com/zmzzyyds/drv-lab/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drvlab = [
    "rootfs/assets/*",
    "driver/assets/*",
    "kernel/fragments/*.config",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "qemu: requires a QEMU run (deselect with '-m \"not qemu\"')",
    "slow: requires network access and a kernel build",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
